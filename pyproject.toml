[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repodoctor"
version = "0.1.0"
description = "A CLI that checks what's missing on your machine to run any repo."
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
repodoctor = "repodoctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoctor"]
